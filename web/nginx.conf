server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy vers le serveur d'actions HTTP interne du poller (donner un
    # objet à un joueur, etc.). Le poller écoute sur son port interne
    # ACTION_HTTP_PORT (8091 par défaut), jamais publié directement sur
    # l'hôte — seul nginx y accède via le réseau Docker interne.
    location /api/ {
        proxy_pass http://poller:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }
}
