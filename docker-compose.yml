services:
  poller:
    image: python:3.12-alpine
    container_name: factorio-stats-poller
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && python poller.py"]
    environment:
      - FACTORIO_RCON_HOST=${RCON_HOST}
      - FACTORIO_RCON_PORT=${RCON_PORT:-27015}
      - FACTORIO_RCON_PASSWORD=${RCON_PASSWORD}
      - POLL_INTERVAL=15
      - OUTPUT_PATH=/data/stats.json
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-factorio/chat}
      - CHAT_LIMIT=50
      - CHAT_HISTORY_PATH=/data/chat_history.json
      - HISTORY_PATH=/data/history.json
      - HISTORY_INTERVAL=300
      - HISTORY_MAX_POINTS=288
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MQTT_ALERT_PREFIX=factorio/alerts
      - ELECTRICITY_ALERT_MARGIN_PCT=${ELECTRICITY_ALERT_MARGIN_PCT:-100}
      - ELECTRICITY_ALERT_COOLDOWN=300
      - ACTION_TOKEN=${ACTION_TOKEN}
      - ACTION_HTTP_PORT=8091
      - ACTION_MAX_COUNT=${ACTION_MAX_COUNT:-1000}
      - ACTION_COOLDOWN_SECONDS=2
      - PLAYER_ACTION_COOLDOWN_SECONDS=${PLAYER_ACTION_COOLDOWN_SECONDS:-7200}
    volumes:
      - ./poller/poller.py:/app/poller.py:ro
      - ./poller/requirements.txt:/app/requirements.txt:ro
      - ./VERSION:/app/VERSION:ro
      - ./data:/data
    restart: unless-stopped
  web:
    image: nginx:alpine
    container_name: factorio-stats-web
    volumes:
      - ./web/public:/usr/share/nginx/html
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/usr/share/nginx/html/data:ro
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      - poller
