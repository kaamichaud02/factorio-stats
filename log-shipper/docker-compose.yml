services:
  mosquitto:
    image: eclipse-mosquitto:${MQTT_VERSION:-2}
    container_name: ${STACK_NAME:-factorio-mosquitto}
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  log-shipper:
    image: python:3.12-alpine
    container_name: factorio-log-shipper
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && python ship_chat.py"]
    environment:
      - LOG_PATH=/factorio-logs/console.log
      - OFFSET_PATH=/data/offset.txt
      - POLL_INTERVAL=2
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=${MQTT_TOPIC:-factorio/chat}
    volumes:
      - ./ship_chat.py:/app/ship_chat.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      # <-- Ajuste le chemin source ci-dessous pour pointer vers le vrai
      # fichier --console-log de ton serveur Factorio (chemin HOST:conteneur)
      - /opt/factorio/console.log:/factorio-logs/console.log:ro
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
  mosquitto-log:
