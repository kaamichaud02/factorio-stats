services:
  mosquitto:
    image: eclipse-mosquitto:${MQTT_VERSION:-2}
    container_name: ${STACK_NAME:-factorio-mosquitto}
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  log-shipper:
    image: python:3.12-alpine
    container_name: factorio-log-shipper
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && python ship_chat.py"]
    environment:
      - LOG_PATH=/factorio-logs/console.log
      - OFFSET_PATH=/data/offset.txt
      - POLL_INTERVAL=2
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=${MQTT_TOPIC:-factorio/chat}
    volumes:
      - ./ship_chat.py:/app/ship_chat.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      # Chemin confirmé du fichier --console-log — serveur danger-ore-omnimatter-maze
      # (bascule depuis factorio-comfy)
      - /opt/factorio-danger-ore/console.log:/factorio-logs/console.log:ro
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - mosquitto

  host-metrics:
    image: python:3.12-alpine
    container_name: factorio-host-metrics
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && python host_metrics.py"]
    environment:
      - PROC_PATH=/host/proc
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - HOST_METRICS_TOPIC=${HOST_METRICS_TOPIC:-factorio/host-metrics}
      - INTERVAL=5
    volumes:
      - ./host_metrics.py:/app/host_metrics.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      # /proc de l'HÔTE en lecture seule — nécessaire pour lire les vraies
      # métriques CPU/RAM/disque de la VM plutôt que celles, potentiellement
      # limitées, du conteneur.
      - /proc:/host/proc:ro
    restart: unless-stopped
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
  mosquitto-log:
